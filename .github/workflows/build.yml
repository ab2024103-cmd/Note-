name: build

on:
  push:
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Validate application icons
        run: python3 tools/generate_icons.py --check
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace \
            :androidApp:assembleRelease :androidApp:assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/gradle-android.log"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-android
          path: ${{ runner.temp }}/gradle-android.log
          if-no-files-found: warn
      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop-windows:
    name: Windows EXE + MSI installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Validate application icons
        shell: pwsh
        run: python tools/generate_icons.py --check
      - name: Test shared editor + compile desktop
        shell: pwsh
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace :shared:desktopTest :desktopApp:compileKotlin `
            2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gradle-desktop.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report editor regression tests
        if: always()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem "shared/build/test-results/desktopTest/TEST-*.xml" -ErrorAction SilentlyContinue)
          $tests = 0; $failures = 0; $skipped = 0
          foreach ($file in $reports) {
            [xml]$report = Get-Content -Raw $file.FullName
            $tests += [int]$report.testsuite.tests
            $failures += [int]$report.testsuite.failures + [int]$report.testsuite.errors
            $skipped += [int]$report.testsuite.skipped
            foreach ($case in $report.testsuite.testcase) {
              if ($case.failure -or $case.error) {
                $details = "$($case.classname).$($case.name): $($case.failure.InnerText) $($case.error.InnerText)"
                $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error::$details"
              }
            }
          }
          if ($reports.Count -eq 0) {
            Get-Content "$env:RUNNER_TEMP/gradle-desktop.log" -ErrorAction SilentlyContinue |
              Where-Object { $_ -match '^e:|^error:' } | Select-Object -First 20 | ForEach-Object {
                $details = $_.Replace('%', '%25')
                Write-Output "::error::$details"
              }
          }
          if ($reports.Count -gt 0) {
            $summary = "Editor regression tests: $tests tests, $failures failures, $skipped skipped."
            Write-Output "::notice::$summary"
            $summary | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
      - name: Install WiX Toolset (for MSI)
        if: success()
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress | Out-Null
      - name: Package MSI + EXE installers
        if: success()
        shell: pwsh
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace `
            :desktopApp:packageMsi :desktopApp:packageExe `
            2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gradle-desktop-package.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-desktop
          path: |
            ${{ runner.temp }}/gradle-desktop.log
            ${{ runner.temp }}/gradle-desktop-package.log
          if-no-files-found: warn
      - name: Upload editor test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-test-results
          path: |
            shared/build/test-results/desktopTest/**
            shared/build/reports/tests/desktopTest/**
          if-no-files-found: warn
      - name: Upload installer artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

  publish-binaries:
    name: Publish binaries to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [android, desktop-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - name: Create/update GitHub Release v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          mkdir -p staged
          find artifacts -type f \( -name "*.apk" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} staged/ \;
          (cd staged && md5sum * > ../CHECKSUMS.md5)
          echo "Built from commit $SHA on $(date -u)" > BUILD_INFO.txt
          {
            echo "NotePad Pro 1.0.0 — Kotlin Multiplatform notes app for Windows and Android."
            echo
            echo "Built from commit $SHA."
            echo
            echo "Includes selection-aware wrapped-line coloring, corrected pasted-list numbering, a movable Find & Replace palette, autosave/focus fixes, and native NotePad Pro icons."
            echo
            echo "Android update warning: export/back up notes before updating. CI debug signing keys can differ between builds, which may block in-place updates. Do not uninstall the old app before backing up; uninstalling removes local notes."
            echo
            echo "Assets: native jpackage .exe and .msi Windows installers; release and debug APKs (minSdk 21, offline-first, no network permission). Checksums in CHECKSUMS.md5."
          } > NOTES.md
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 \
            --target "$SHA" \
            --title "NotePad Pro 1.0.0" \
            --notes-file NOTES.md \
            staged/* CHECKSUMS.md5 BUILD_INFO.txt
